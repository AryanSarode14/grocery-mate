<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add an item · Grocery Mate</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/pantry-form.css" />
    <script type="module" src="js/pantry-form.js"></script>
  </head>
  <body>
    <header class="topbar">
      <nav aria-label="Main">
        <a href="pantry.html" aria-current="page">Pantry</a>
        <a href="browse.html">Recipes</a>
      </nav>
    </header>
    <main>
      <h1 id="title">Add an item</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="errors" class="alert" role="alert" tabindex="-1" hidden></div>

      <section id="join" hidden>
        <p>Join a household to add items.</p>
        <p><a class="button" href="index.html">Join a household</a></p>
      </section>

      <form id="form" class="form" hidden>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" required maxlength="80" />
        </div>
        <div class="field">
          <label for="quantity">Quantity</label>
          <input
            id="quantity"
            name="quantity"
            maxlength="40"
            placeholder="e.g. 2 kg"
          />
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category" name="category">
            <option value="produce">produce</option>
            <option value="dairy">dairy</option>
            <option value="meat">meat</option>
            <option value="seafood">seafood</option>
            <option value="grains">grains</option>
            <option value="bakery">bakery</option>
            <option value="spices">spices</option>
            <option value="canned">canned</option>
            <option value="frozen">frozen</option>
            <option value="snacks">snacks</option>
            <option value="drinks">drinks</option>
            <option value="other" selected>other</option>
          </select>
        </div>
        <div class="field">
          <label for="boughtBy">Bought by</label>
          <input
            id="boughtBy"
            name="boughtBy"
            maxlength="40"
            autocomplete="name"
          />
        </div>
        <div class="field">
          <label for="expiry">Expiry date</label>
          <input id="expiry" name="expiry" type="date" />
        </div>
        <div class="actions">
          <button id="save" type="submit">Save item</button>
          <a class="button quiet" href="pantry.html">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
