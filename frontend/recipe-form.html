<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add a recipe · Grocery Mate</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/recipe-form.css" />
    <script type="module" src="js/recipe-form.js"></script>
  </head>
  <body>
    <header class="topbar">
      <nav aria-label="Main">
        <a href="pantry.html">Pantry</a>
        <a href="browse.html" aria-current="page">Recipes</a>
      </nav>
    </header>
    <main>
      <h1 id="title">Add a recipe</h1>
      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="errors" class="alert" role="alert" tabindex="-1" hidden></div>

      <section id="join" hidden>
        <p>Join a household to add recipes.</p>
        <p><a class="button" href="index.html">Join a household</a></p>
      </section>

      <form id="form" class="form" hidden>
        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" required maxlength="120" />
        </div>
        <div class="field">
          <label for="minutes">Minutes</label>
          <input
            id="minutes"
            name="minutes"
            type="number"
            inputmode="numeric"
            min="1"
            max="1440"
            step="1"
            required
          />
        </div>
        <div class="field">
          <label for="ingredients">Ingredients</label>
          <p id="ingredients-hint" class="hint">One per line.</p>
          <textarea
            id="ingredients"
            name="ingredients"
            rows="6"
            required
            aria-describedby="ingredients-hint"
          ></textarea>
        </div>
        <div class="field">
          <label for="steps">Steps</label>
          <p id="steps-hint" class="hint">One per line.</p>
          <textarea
            id="steps"
            name="steps"
            rows="6"
            required
            aria-describedby="steps-hint"
          ></textarea>
        </div>
        <div class="field">
          <label for="tags">Tags</label>
          <p id="tags-hint" class="hint">Comma separated, e.g. dinner, easy.</p>
          <input id="tags" name="tags" aria-describedby="tags-hint" />
        </div>
        <div class="field">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="createdBy">Your name</label>
          <input id="createdBy" name="createdBy" autocomplete="name" />
        </div>
        <div class="actions">
          <button id="save" type="submit">Save recipe</button>
          <a id="cancel" class="button quiet" href="browse.html">Cancel</a>
        </div>
      </form>
    </main>
  </body>
</html>
